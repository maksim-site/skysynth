<!doctype html>
<!-- Source for public/og.png. Screenshot at 1200x630, then delete nothing: keep
     this file so the card can be regenerated when the headline changes. -->
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Unbounded";
        src: url("assets/fonts/unbounded-400-cyrillic.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Unbounded";
        src: url("assets/fonts/unbounded-500-cyrillic.woff2") format("woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: "Golos Text";
        src: url("assets/fonts/golos-text-600-cyrillic.woff2") format("woff2");
        font-weight: 600;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: #080b0d;
        font-family: "Unbounded", sans-serif;
        color: #f2efe8;
      }
      .stage {
        position: absolute;
        inset: 0;
        transform: translateX(42px);
      }
      .stage img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 72% center;
      }
      /* Same board placement as the live hero composite, in og pixels. */
      .board {
        position: absolute;
        top: 86px;
        left: 630px;
        width: 490px;
        height: 490px;
        object-fit: contain;
        transform: rotate(-16.5deg) scale(0.96);
        filter: brightness(1.12) contrast(1.18) saturate(1.08)
          drop-shadow(0 3px 2px rgba(0, 0, 0, 0.5))
          drop-shadow(0 11px 15px rgba(0, 0, 0, 0.3));
      }
      .veil {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          100deg,
          rgba(8, 11, 13, 0.96) 0%,
          rgba(8, 11, 13, 0.9) 34%,
          rgba(8, 11, 13, 0.42) 56%,
          rgba(8, 11, 13, 0.18) 100%
        );
      }
      .copy {
        position: absolute;
        top: 80px;
        left: 76px;
        width: 650px;
      }
      .logo {
        height: 40px;
        width: auto;
        margin-bottom: 42px;
      }
      h1 {
        margin: 0;
        font-size: 49px;
        font-weight: 400;
        letter-spacing: -0.045em;
        line-height: 1.08;
      }
      h1 span {
        display: block;
      }
      h1 span:last-child {
        color: #d4b487;
      }
      .foot {
        position: absolute;
        bottom: 66px;
        left: 78px;
        display: flex;
        gap: 14px;
        align-items: center;
        color: #9d9d96;
        font-family: "Golos Text", sans-serif;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .foot b {
        color: #f2efe8;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <img src="assets/images/hero-stage-dark-wide.webp" alt="" />
    </div>
    <img
      class="board"
      src="assets/images/boards/flight-controller-front-polished.webp"
      alt=""
    />
    <div class="veil"></div>
    <div class="copy">
      <img class="logo" src="brand/sks-logo-for-dark-bg.svg" alt="СКС" />
      <h1>
        <span>Разработка электроники</span>
        <span>для сложных устройств</span>
        <span>от идеи до производства</span>
      </h1>
    </div>
    <div class="foot">
      <b>СКАЙСИНТ ИНЖИНИРИНГ</b>
      <span>·</span>
      <span>Платы · Встраиваемое ПО · ЕСКД</span>
    </div>
  </body>
</html>
