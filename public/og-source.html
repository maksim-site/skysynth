<!doctype html>
<!-- Source for public/og.png. Screenshot at 1200x630, then delete nothing: keep
     this file so the card can be regenerated when the headline changes. -->
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Manrope";
        src: url("/assets/fonts/manrope-600.woff2") format("woff2");
        font-weight: 600;
      }
      @font-face {
        font-family: "Manrope";
        src: url("/assets/fonts/manrope-800.woff2") format("woff2");
        font-weight: 800;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: #080b0d;
        font-family: "Manrope", sans-serif;
        color: #f2efe8;
      }
      .stage {
        position: absolute;
        inset: 0;
      }
      .stage img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 62% center;
      }
      /* Same board placement as the live hero composite, in og pixels. */
      .board {
        position: absolute;
        top: 101px;
        left: 600px;
        width: 461px;
        height: 461px;
        object-fit: contain;
        transform: rotate(-16.5deg) scale(0.96);
        filter: brightness(0.72) contrast(1.16) saturate(1.08)
          drop-shadow(0 3px 2px rgba(0, 0, 0, 0.5))
          drop-shadow(0 11px 15px rgba(0, 0, 0, 0.3));
      }
      .veil {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          100deg,
          rgba(8, 11, 13, 0.96) 0%,
          rgba(8, 11, 13, 0.9) 34%,
          rgba(8, 11, 13, 0.42) 56%,
          rgba(8, 11, 13, 0.18) 100%
        );
      }
      .copy {
        position: absolute;
        top: 92px;
        left: 76px;
        width: 620px;
      }
      .logo {
        height: 42px;
        width: auto;
        margin-bottom: 44px;
      }
      h1 {
        margin: 0;
        font-size: 60px;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1.04;
      }
      h1 span {
        display: block;
      }
      h1 span:last-child {
        color: #d4b487;
      }
      .foot {
        position: absolute;
        bottom: 66px;
        left: 78px;
        display: flex;
        gap: 14px;
        align-items: center;
        color: #9d9d96;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .foot b {
        color: #f2efe8;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <img src="/assets/images/hero-stage-dark-wide.webp" alt="" />
    </div>
    <img
      class="board"
      src="/assets/images/boards/flight-controller-transparent.webp"
      alt=""
    />
    <div class="veil"></div>
    <div class="copy">
      <img class="logo" src="/brand/sks-logo-for-dark-bg.svg" alt="СКС" />
      <h1>
        <span>Программно-аппаратные</span>
        <span>комплексы</span>
        <span>от схемы до серии</span>
      </h1>
    </div>
    <div class="foot">
      <b>СКАЙСИНТ ИНЖИНИРИНГ</b>
      <span>·</span>
      <span>Санкт-Петербург</span>
      <span>·</span>
      <span>info@skysinth.com</span>
    </div>
  </body>
</html>
