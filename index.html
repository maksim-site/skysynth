<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="СКАЙСИНТ ИНЖИНИРИНГ. Разработка бортовой электроники для БПЛА, печатных плат, встраиваемого ПО и документации по ЕСКД."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta
      property="og:title"
      content="СКАЙСИНТ ИНЖИНИРИНГ. Электроника для БПЛА"
    />
    <meta
      property="og:description"
      content="Полётные контроллеры, ESC, видеопередатчики, каналы связи и печатные платы."
    />
    <meta property="og:image" content="%BASE_URL%og.png" />
    <meta
      property="og:image:alt"
      content="СКАЙСИНТ ИНЖИНИРИНГ. Электроника для БПЛА"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="СКАЙСИНТ ИНЖИНИРИНГ. Электроника для БПЛА"
    />
    <meta
      name="twitter:description"
      content="Полётные контроллеры, ESC, видеопередатчики, каналы связи и печатные платы."
    />
    <meta name="twitter:image" content="%BASE_URL%og.png" />
    <meta name="theme-color" content="#080b0d" />
    <title>СКАЙСИНТ ИНЖИНИРИНГ. Электроника для БПЛА</title>
    <script>
      try {
        const savedTheme =
          localStorage.getItem("skysynth-theme") === "light"
            ? "light"
            : "dark";
        document.documentElement.dataset.theme = savedTheme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute(
            "content",
            savedTheme === "light" ? "#f4f3ef" : "#080b0d",
          );
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
