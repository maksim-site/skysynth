    <script>
      try {
        const savedTheme =
          localStorage.getItem("skysynth-theme") === "light"
            ? "light"
            : "dark";
        document.documentElement.dataset.theme = savedTheme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute(
            "content",
            savedTheme === "light" ? "#f3f0ea" : "#08090a",
          );
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
